<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Amit Chakraborty</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --signal: #16A07C;
      --signal-light: #E6F7F2;
      --signal-border: rgba(22,160,124,0.25);
      --bg: #F7F8FA;
      --surface: #FFFFFF;
      --ink: #0D0F12;
      --muted: #4B5563;
      --ghost: #9CA3AF;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      min-height: 100vh;
    }

    .terminal {
      background: #1A1D23;
      border-radius: 12px;
      overflow: hidden;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    }

    .terminal-bar {
      background: #14161C;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-red   { background: #FF5F57; }
    .dot-amber { background: #FEBC2E; }
    .dot-green { background: #28C840; }

    .terminal-filename {
      margin-left: auto;
      font-size: 11px;
      color: #4B5563;
    }

    .terminal-body {
      padding: 24px;
      font-size: 13px;
      line-height: 1.9;
      color: #9CA3AF;
    }

    .signal { color: #16A07C; }
    .dim    { color: #4B5563; }

    .badge {
      display: inline-block;
      background: var(--signal-light);
      border: 1px solid var(--signal-border);
      color: var(--signal);
      font-size: 11px;
      padding: 5px 14px;
      border-radius: 9999px;
      margin-top: 24px;
    }

    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-size: clamp(2rem, 6vw, 3.5rem);
      color: var(--ink);
      font-weight: 400;
      margin: 20px 0 12px;
      line-height: 1.1;
    }

    p {
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      max-width: 380px;
      margin: 0 auto 24px;
    }

    .btn {
      display: inline-block;
      background: var(--signal);
      color: white;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      transition: box-shadow 0.2s;
    }
    .btn:hover {
      box-shadow: 0 4px 24px rgba(22,160,124,0.25);
    }
  </style>
</head>
<body>
  <div class="terminal">
    <div class="terminal-bar">
      <span class="dot dot-red"></span>
      <span class="dot dot-amber"></span>
      <span class="dot dot-green"></span>
      <span class="terminal-filename">network.status</span>
    </div>
    <div class="terminal-body">
      <div class="signal">&gt; mem0.search("connection")</div>
      <div class="dim">// [connecting...]</div>
      <div class="signal">⚠ network unreachable</div>
      <div class="dim">// { status: "offline", cached: true }</div>
    </div>
  </div>

  <h1>You're offline.</h1>

  <p>
    The portfolio will be here when you reconnect.
    The memory persists — even without a connection.
  </p>

  <a href="/" class="btn">Try Again ↗</a>

  <div class="badge">
    // amit.co · mem0 · Kolkata → Remote
  </div>
</body>
</html>
