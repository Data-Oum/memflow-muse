<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Amit Chakraborty</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
      background: #FFFFFF;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 24px;
      border-radius: 12px;
      background: #F3EEFF;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg {
      width: 24px;
      height: 24px;
      color: #7C3AED;
    }
    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    p {
      color: #6B7280;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #7C3AED;
      color: white;
      border: none;
      border-radius: 9999px;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }
    .retry-btn:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }
    .retry-btn:active {
      transform: translateY(0);
    }
    .status {
      margin-top: 24px;
      font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', monospace;
      font-size: 11px;
      color: #9CA3AF;
    }
    .mem0-tag {
      display: inline-block;
      font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', monospace;
      font-size: 10px;
      color: #7C3AED;
      background: #F3EEFF;
      border: 1px solid rgba(124,58,237,0.18);
      border-radius: 999px;
      padding: 3px 10px;
      margin-bottom: 20px;
      letter-spacing: 0.02em;
    }
    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9CA3AF;
      margin-right: 6px;
      vertical-align: middle;
    }
    .dot.online {
      background: #7C3AED;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 011.06 0z" />
      </svg>
    </div>
    <div class="mem0-tag">memory.status = "offline"</div>
    <h1>You're offline</h1>
    <p>The memory can't be retrieved right now. Check your connection and try again — the portfolio reloads automatically when you're back.</p>
    <button class="retry-btn" onclick="checkAndReload()">
      Try again
    </button>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Checking connection…</span>
    </div>
  </div>

  <script>
    function checkAndReload() {
      if (navigator.onLine) {
        location.reload();
      } else {
        document.getElementById('statusText').textContent = 'Still offline. Will retry in 10s…';
      }
    }

    function updateStatus() {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      if (navigator.onLine) {
        dot.classList.add('online');
        text.textContent = 'Back online — reloading…';
        setTimeout(() => location.reload(), 800);
      } else {
        dot.classList.remove('online');
        text.textContent = 'No connection detected';
      }
    }

    window.addEventListener('online', updateStatus);
    updateStatus();

    // Auto-retry every 10 seconds
    setInterval(() => {
      if (navigator.onLine) {
        location.reload();
      }
    }, 10000);
  </script>
</body>
</html>
